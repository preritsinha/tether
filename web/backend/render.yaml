# Render blueprint for the Waysera relay.
# NOTE: the deployed service is still named after the previous working title.
# Rename it only once the new service is live and verified — the frontend
# points at the existing URL and would break on an early rename.
services:
  - type: web
    name: waysera-relay
    runtime: python
    rootDir: web/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
