<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waysera — tests</title>
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 64px;
            line-height: 1.5;
        }
        h1 { font-size: 22px; font-weight: 780; letter-spacing: -0.5px; margin-bottom: 4px; }
        .subtitle { color: #64748B; font-size: 14px; margin-bottom: 24px; }
        h2 { font-size: 17px; margin: 0 0 16px; }
        .row {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
            padding: 5px 10px;
            border-left: 3px solid transparent;
            border-radius: 4px;
        }
        .pass { color: #0F766E; border-left-color: #14B8A6; }
        .fail { color: #B91C1C; border-left-color: #DC2626; background: rgba(220, 38, 38, 0.07); }
        pre {
            margin: 6px 0 6px 16px;
            white-space: pre-wrap;
            font-size: 12px;
            color: #B91C1C;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0B1120; color: #F8FAFC; }
            .pass { color: #5EEAD4; }
            .fail, pre { color: #FCA5A5; }
        }
    </style>
</head>
<body>
    <h1>Waysera tests</h1>
    <p class="subtitle">
        Crypto, local store, and peer-input validation, run in a real browser —
        WebCrypto and IndexedDB have no faithful equivalent under Node.
    </p>
    <div id="results"></div>

    <script src="assets/crypto.js"></script>
    <script src="assets/validate.js"></script>
    <script src="assets/store.js"></script>
    <script src="tests.js"></script>
</body>
</html>
